<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NYC DOT Parking Regulations Map</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: Arial, sans-serif;
    }

    #map {
      height: 100vh;
      width: 100vw;
    }

    .info-legend {
      background: white;
      padding: 12px 16px;
      line-height: 1.6;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      font-size: 13px;
    }

    .info-legend h4 {
      margin: 0 0 8px;
      font-size: 14px;
    }

    .legend-key {
      display: inline-block;
      width: 12px;
      height: 12px;
      margin-right: 6px;
      vertical-align: middle;
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const map = L.map('map', { preferCanvas: true }).setView([40.7128, -74.0060], 13);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 16,
      attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ'
    }).addTo(map);

    // rule_class is set per zone by map_curb_lines.py (the strictest rule covering that piece of curb)
    const RULE_COLORS = {
      no_stopping: '#d9534f',
      no_standing: '#d9534f',
      no_parking: '#d9534f',
      limited_parking: '#f0ad4e',
      loading: '#3388ff',
      other: '#999999'
    };

    function styleCurbLine(feature) {
      return {
        color: RULE_COLORS[feature.properties.rule_class] || RULE_COLORS.other,
        weight: 4,
        opacity: 0.85
      };
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text == null ? '' : String(text);
      return div.innerHTML;
    }

    function popupFor(props) {
      const regulations = String(props.regulations || '').split(' | ').map(escapeHtml).join('<br/>');
      return `<div>
        <strong>${escapeHtml(props.on_street)}</strong><br/>
        <small>${escapeHtml(props.from_street)} to ${escapeHtml(props.to_street)} (${escapeHtml(props.side_of_street)} side)</small>
        <hr/>${regulations}
        <hr/><small>Segment ID: ${escapeHtml(props.SegmentID)}</small>
      </div>`;
    }

    // One file per borough keeps each download small enough for the browser
    const BOROUGHS = {
      manhattan: 'Manhattan',
      brooklyn: 'Brooklyn',
      queens: 'Queens',
      bronx: 'Bronx',
      staten_island: 'Staten Island'
    };
    let parkingLayer = null;

    function loadBorough(key) {
      statusEl.textContent = 'Loading ' + BOROUGHS[key] + '...';
      return fetch('zones/zones_' + key + '.geojson')
        .then(response => {
          if (!response.ok) {
            throw new Error('Could not load zones/zones_' + key + '.geojson');
          }
          return response.json();
        })
        .then(geojsonData => {
          if (parkingLayer) {
            map.removeLayer(parkingLayer);
          }
          parkingLayer = L.geoJSON(geojsonData, {
            style: styleCurbLine,
            onEachFeature: (feature, layer) => layer.bindPopup(popupFor(feature.properties))
          }).addTo(map);

          if (parkingLayer.getBounds().isValid()) {
            map.fitBounds(parkingLayer.getBounds());
          }
          statusEl.textContent = '';
        })
        .catch(error => {
          statusEl.textContent = 'Could not load ' + BOROUGHS[key];
          console.error('Error loading GeoJSON data:', error);
        });
    }

    const picker = L.control({ position: 'topright' });
    let statusEl;
    picker.onAdd = function () {
      const div = L.DomUtil.create('div', 'info-legend');
      const options = Object.entries(BOROUGHS)
        .map(([key, name]) => `<option value="${key}">${name}</option>`).join('');
      div.innerHTML = `<h4>Borough</h4><select id="borough">${options}</select><div id="status"></div>`;
      L.DomEvent.disableClickPropagation(div);
      return div;
    };
    picker.addTo(map);
    statusEl = document.getElementById('status');
    document.getElementById('borough').addEventListener('change', event => loadBorough(event.target.value));
    loadBorough('manhattan');

    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = function () {
      const div = L.DomUtil.create('div', 'info-legend');
      div.innerHTML = `
        <h4>Parking Regulations</h4>
        <div><span class="legend-key" style="background: #d9534f;"></span> No Parking / Standing / Stopping</div>
        <div><span class="legend-key" style="background: #f0ad4e;"></span> Metered / Time-Restricted</div>
        <div><span class="legend-key" style="background: #3388ff;"></span> Loading / Taxi / Bus</div>
        <div><span class="legend-key" style="background: #999999;"></span> Other</div>
      `;
      return div;
    };
    legend.addTo(map);
  </script>
</body>
</html>
